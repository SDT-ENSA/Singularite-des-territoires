<script>
/* DAL · Partie 4a/5 : score de combinaison, fiche-phrase, lecture vocale */
(function () {
  if (!window.DX || !DX.SECT) { alert("Partie 4a : collez d'abord les Parties 1 à 3b."); return; }
  DX.sur('Partie 4a', function () {
    const h = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const up = (d, n) => { let p = d; while (p && p.depth > n) p = p.parent; return p && p.depth === n ? p : null; };
    const minus = t => t ? t.charAt(0).toLowerCase() + t.slice(1) : t;

    /* ---------- 1. NOMS (données, sinon texte affiché) ---------- */
    const CH = [null, 'pilier', 'pole', 'source', 'notion'];
    let carte = null;
    function nomDOM(d) {
      if (!carte) {
        carte = new Map();
        document.querySelectorAll('#chart text').forEach(t => {
          const x = t.__data__; if (!x || typeof x !== 'object') return;
          const ts = t.querySelectorAll('tspan');
          const s = (ts.length ? Array.from(ts).map(e => e.textContent).join(' ') : t.textContent).trim();
          if (s.length > (carte.get(x) || '').length) carte.set(x, s);
        });
      }
      return carte.get(d) || '';
    }
    function nom(d) {
      if (!d) return '';
      const x = d.data;
      if (typeof x === 'string') return x;
      if (Array.isArray(x) && typeof x[0] === 'string') return x[0];
      if (x && typeof x === 'object') {
        const s = x.nom || x.name || x.label || x[CH[d.depth]];
        if (typeof s === 'string' && s) return s;
      }
      return nomDOM(d) || String(d.id || d.cle || '?');
    }
    const typeDe = d => d.type || (d.data && d.data.type) || null;
    const typeLabel = t => (typeof TYPES !== 'undefined' && TYPES[t] && (TYPES[t].court || TYPES[t].label)) || t || '';

    /* Notions rattachées à une source (nœuds, sinon texte du CSV) */
    const pool = new Set(tous);
    if (typeof notions !== 'undefined' && Array.isArray(notions)) notions.forEach(n => { if (n && n.depth !== undefined) pool.add(n); });
    function notionsDe(s) {
      const ns = [...pool].filter(n => n.depth === 4 && n.parent === s).map(nom);
      if (ns.length) return ns;
      const x = s.data && s.data.notions;
      return typeof x === 'string' ? x.split(/\s*\|\s*/).filter(Boolean) : [];
    }
    const sources = () => tous.filter(d => d.depth === 3);
    const poles = () => tous.filter(d => d.depth === 2);
    const nouveau = d => { try { return typeof estNouveau === 'function' && !!estNouveau(d); } catch (_) { return false; } };

    function phrase(s, court) {
      const pi = up(s, 1), po = up(s, 2), ns = notionsDe(s).map(minus);
      return (court ? '' : (pi ? nom(pi) + ' → ' : '') + (po ? nom(po) + ' → ' : '')) +
        nom(s) + (ns.length ? ' : ' + ns.join(', ') : '');
    }

    /* ---------- 2. SCORE ---------- */
    DX.resoExtra = DX.resoExtra || [];          /* la Partie 5 y ajoutera les résonances de sens */
    const nd = x => (x && typeof x === 'object') ? x
      : (typeof parId !== 'undefined' && parId ? (parId.get ? parId.get(x) : parId[x]) : null);
    function score() {
      const S = sources(), P = poles();
      let eq = 0;
      P.forEach(p => {
        const t = new Set(S.filter(s => up(s, 2) === p).map(typeDe).filter(Boolean));
        eq += Math.min(t.size, 3) / 3;
      });
      eq = P.length ? eq / P.length : 0;
      const R = (typeof resonances !== 'undefined' && Array.isArray(resonances) ? resonances : []).concat(DX.resoExtra);
      let pts = 0, internes = 0;
      R.forEach(r => {
        const a = nd(r.a), b = nd(r.b); if (!a || !b) return;
        if (up(a, 2) && up(a, 2) === up(b, 2)) { pts += 1; internes++; }
        else if (up(a, 1) && up(a, 1) === up(b, 1)) pts += 0.5;
      });
      const re = R.length ? pts / R.length : 0;
      const M = tous.filter(d => d.depth >= 2), nv = M.filter(nouveau).length;
      const or = M.length ? nv / M.length : 0;
      const pc = v => Math.round(v * 100);
      return { total: pc((eq + re + or) / 3), equilibre: pc(eq), resonances: pc(re), originalite: pc(or),
        internes, nbReso: R.length, nouvelles: nv };
    }

    const w = document.body.appendChild(document.createElement('div'));
    w.id = 'dx-score';
    w.title = 'Clic : replier / déplier · F : fiche de la combinaison';
    w.onclick = () => w.classList.toggle('mini');
    let precedent = null, cleV = '';
    function ligne(lbl, v, info) {
      return '<div class="l" title="' + h(info) + '"><span>' + lbl + '</span><div class="j"><i style="width:' + v + '%"></i></div><span>' + v + '</span></div>';
    }
    function afficher(force) {
      if (!force && DX.occupe()) return;
      const k = tous.map(d => d.slot).join(',') + '|' + Array.from(crans).join(',');
      if (!force && k === cleV) return;
      cleV = k;
      const s = score();
      const dt = precedent === null ? 0 : s.total - precedent;
      precedent = s.total;
      w.innerHTML = '<b>Score<span>' + s.total + (dt ? '<em style="color:' + (dt > 0 ? 'var(--nouveau,#2ec4b6)' : 'var(--rouge,#d0402b)') + '">' + (dt > 0 ? '+' : '') + dt + '</em>' : '') + '</span></b>' +
        ligne('Équilibre', s.equilibre, 'Pôles qui gardent figure + projet + pratique') +
        ligne('Résonances', s.resonances, s.internes + ' résonance(s) à l\'intérieur d\'un même pôle sur ' + s.nbReso) +
        ligne('Originalité', s.originalite, s.nouvelles + ' filiation(s) nouvelle(s)');
    }
    setInterval(afficher, 300);
    afficher(true);

    /* ---------- 3. LECTURE VOCALE ---------- */
    function dire(t) {
      if (!('speechSynthesis' in window)) return DX.toast('Lecture vocale non disponible dans ce navigateur');
      const sy = speechSynthesis;
      if (sy.speaking) { sy.cancel(); return DX.toast('■ Lecture arrêtée'); }
      const u = new SpeechSynthesisUtterance(t.replace(/→/g, ', ').replace(/

$$
\+IA
$$

/g, ''));
      u.lang = 'fr-FR'; u.rate = 0.95;
      const v = sy.getVoices().find(v => /^fr/i.test(v.lang));
      if (v) u.voice = v;
      sy.speak(u);
    }
    const sel = () => (typeof selection !== 'undefined' && selection && selection.depth !== undefined) ? selection : null;
    function texteDe(d) {
      if (!d) return null;
      if (d.depth === 4 && d.parent) d = d.parent;
      if (d.depth === 3) return phrase(d);
      if (d.depth === 2) return nom(d) + ' réunit ' + sources().filter(s => up(s, 2) === d).map(nom).join(', ');
      if (d.depth === 1) return nom(d) + ' : ' + poles().filter(p => up(p, 1) === d).map(nom).join(', ');
      return null;
    }
    function lireSelection() {
      const t = texteDe(sel());
      t ? dire(t) : DX.toast('Sélectionnez un élément (clic), puis L');
    }

    /* Phrase + bouton 🔊 en tête du panneau de détail */
    if (typeof panneauDetail === 'function') {
      const o = panneauDetail;
      panneauDetail = function (d) {
        const r = o.apply(this, arguments);
        try {
          const pn = document.getElementById('panneau'), t = texteDe(d);
          if (pn && t) {
            pn.querySelectorAll('.dx-phrase').forEach(e => e.remove());
            const div = document.createElement('div');
            div.className = 'dx-phrase';
            div.innerHTML = h(t) + '<button class="dx-btn" title="Lire (L)">🔊</button>';
            div.querySelector('button').onclick = () => dire(t);
            const ref = pn.querySelector('h1,h2,h3');
            ref && ref.parentNode === pn ? ref.after(div) : pn.prepend(div);
          }
        } catch (e) { console.error(e); }
        return r;
      };
    }

    /* ---------- 4. FICHE DE LA COMBINAISON ---------- */
    const dlg = document.body.appendChild(document.createElement('div'));
    dlg.id = 'dx-fiche';
    let texteFiche = '';
    function construireFiche() {
      const s = score(), lignes = [];
      let html = '';
      tous.filter(d => d.depth === 1).forEach(pi => {
        poles().filter(p => up(p, 1) === pi).forEach(po => {
          html += '<h5>' + h(nom(pi) + ' → ' + nom(po)) + '</h5>';
          lignes.push(nom(pi) + ' → ' + nom(po));
          sources().filter(x => up(x, 2) === po).forEach(x => {
            const nv = nouveau(x) || [...pool].some(n => n.depth === 4 && n.parent === x && nouveau(n));
            html += '<p data-i="' + tous.indexOf(x) + '"' + (nv ? ' class="nv"' : '') + '><i>' + h(typeLabel(typeDe(x))) + '</i>' + h(phrase(x, true)) + '</p>';
            lignes.push('   ' + (nv ? '★ ' : '') + phrase(x, true));
          });
        });
      });
      const resume = 'Combinaison ' + Array.from(crans).join(' · ') + ' — score ' + s.total + ' — ' + s.nouvelles + ' filiation(s) nouvelle(s)';
      texteFiche = 'DEMAIN ARCHITECTURE LABORATORY\n' + resume + '\n\n' + lignes.join('\n');
      dlg.innerHTML = '<div class="boite"><header>Fiche de la combinaison<small>' + h(resume) + ' · ★ = nouvelle filiation · clic = voir sur la carte</small></header>' +
        '<div class="corps">' + html + '</div><div class="dx-pied"><span></span>' +
        '<button class="dx-btn" data-a="lire">🔊 Lire</button><button class="dx-btn" data-a="copier">📋 Copier</button>' +
        '<button class="dx-btn on" data-a="fermer">Fermer</button></div></div>';
    }
    const ouvrirFiche = () => { construireFiche(); dlg.classList.add('on'); };
    const fermerFiche = () => { dlg.classList.remove('on'); if (window.speechSynthesis) speechSynthesis.cancel(); };
    function copier(t) {
      const repli = () => {
        const ta = document.body.appendChild(document.createElement('textarea'));
        ta.value = t; ta.select();
        try { document.execCommand('copy'); DX.toast('📋 Fiche copiée'); } catch (_) { DX.toast('Copie impossible'); }
        ta.remove();
      };
      navigator.clipboard ? navigator.clipboard.writeText(t).then(() => DX.toast('📋 Fiche copiée'), repli) : repli();
    }
    dlg.addEventListener('click', e => {
      if (e.target === dlg) return fermerFiche();
      const a = e.target.dataset && e.target.dataset.a;
      if (a === 'fermer') return fermerFiche();
      if (a === 'lire') return dire(texteFiche.split('\n').slice(1).join('. ').replace(/★/g, 'nouveau :'));
      if (a === 'copier') return copier(texteFiche);
      const p = e.target.closest('p[data-i]');
      if (p) {
        fermerFiche();
        const d = tous[+p.dataset.i];
        if (typeof selectionner === 'function') selectionner(d, true);
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && dlg.classList.contains('on')) return fermerFiche();
      if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
      if (e.key === 'f' || e.key === 'F') dlg.classList.contains('on') ? fermerFiche() : ouvrirFiche();
      if (e.key === 'l' || e.key === 'L') lireSelection();
    });

    /* ---------- 5. MENU ---------- */
    DX.option({ cle: 'score', label: '◎ Score de la combinaison', section: 'Combinaisons', defaut: true,
      change: v => { w.style.display = v ? '' : 'none'; } });
    DX.action({ label: '📝 Fiche de la combinaison', section: 'Combinaisons', touche: 'F', fn: ouvrirFiche });
    DX.action({ label: '🔊 Lire la sélection', section: 'Combinaisons', touche: 'L', fn: lireSelection });

    Object.assign(DX, { nom, phrase, score, dire, notionsDe, majScore: () => afficher(true) });
    DX.parties.push('4a');
    DX.toast('Partie 4a chargée ✓ · F = fiche · L = lecture');
  });
})();
</script>
<!-- ===== FIN PARTIE 4a/5 ===== -->
