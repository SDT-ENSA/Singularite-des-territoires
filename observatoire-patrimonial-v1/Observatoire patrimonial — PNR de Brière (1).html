:dashed;border-color:#9b7fd0;color:#9b7fd0}\n.tag.prop{background:repeating-linear-gradient(135deg,rgba(214,150,30,.18) 0 4px,transparent 4px 8px);border-color:#c98500;color:#a86d00}\n.dk .tag.prop{color:#e2a83a}\n.dk .tag.ana{color:#b9a3e6;border-color:#b9a3e6}\n.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}\n.fchip{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-size:13px;color:var(--ink)}\n.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--panel)}\n.fchip:hover{border-color:var(--ink)}\n.btn{background:var(--acc);color:var(--panel);border:0;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500}\n.btn:hover{opacity:.88}\n.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink)}\n.ghost:hover{border-color:var(--ink)}\n.stp{background:transparent;border:0;border-left:2px solid var(--line);text-align:left;padding:6px 0 6px 14px;font-size:14px;color:var(--mut);width:100%}\n.stp.on{border-left-color:var(--ink);color:var(--ink);font-weight:500}\n.stp:hover{color:var(--ink)}\n.lrow{display:flex;align-items:center;gap:14px;width:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;text-align:left;font-size:14px;color:var(--ink)}\n.lrow.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}\n.lrow:hover{border-color:var(--mut)}\n.sib{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;text-align:left;color:var(--ink)}\n.sib.on{border-color:var(--ink)}\n.vtab{background:transparent;border:0;padding:6px 8px;font-size:13px;color:var(--mut);border-radius:6px}\n.vtab.on{color:var(--ink);background:var(--chip)}\n.tab{background:transparent;border:1px solid var(--line);padding:7px 14px;font-size:14px;border-radius:8px;color:var(--mut)}\n.tab.on{color:var(--ink);border-color:var(--ink)}\n.drow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;font-size:14px;color:var(--ink)}\n.drow.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)}\n.drow:hover{border-color:var(--mut)}\n.mcell{padding:7px 8px;border:1px solid var(--line);font-size:12px;text-align:center}\n.mcell.self{color:var(--mut)}\n.mcell.dim{opacity:.25}\n.mini{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:left;color:var(--ink)}\n.mini.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}\n.mini:hover{border-color:var(--mut)}\n.cchip{background:transparent;border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:13px;color:var(--ink)}\n.cchip.on{background:var(--acc);color:var(--panel);border-color:var(--acc)}\n.cchip:hover{border-color:var(--ink)}\n.conf{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}\n.conf.c3{background:#1f6f6a;color:#fff}\n.conf.c2{background:#cfe3df;color:#164f4b}\n.conf.c1{border:1px dashed #a86d00;color:#a86d00}\n.conf.c0{border:1px solid var(--line);color:var(--mut)}\n.pcard{background:transparent;border:1px solid #3a444a;border-radius:10px;padding:14px 16px;text-align:left;color:#ece9e3;flex:1 1 220px}\n.pcard.on{border-color:#ece9e3;background:#1d262c}\n.pcard:hover{border-color:#ece9e3}\n.door{display:block;text-align:left;border-radius:14px;padding:24px;border:1px solid;cursor:pointer}\n.door:hover{transform:translateY(-2px)}\n.tbl{width:100%;border-collapse:collapse;font-size:13px}\n.tbl th{text-align:left;font-weight:500;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}\n.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}\n.kv{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:4px 14px;font-size:13.5px}\n.kv dt{color:var(--mut)}\n.kv dd{margin:0}\n.svgbtn{cursor:pointer}\n.svgbtn:hover{opacity:.8}\n.lnk{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-size:inherit}\ninput.search{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px;font-family:inherit;min-width:220px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"{{rootCls}}\" style=\"{{bg}}; min-height: 100vh; font-size: 15px; line-height: 1.55; transition: background .5s, color .5s\" data-canvas-width=\"1440\" data-canvas-height=\"1800\" data-document-role=\"page\" data-label=\"Observatoire patrimonial — modèle OTVP et PNR de Brière\">\n\n<header style=\"background: #0b0f12; color: #ece9e3; padding: 0 20px; border-bottom: 1px solid #222b30\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; min-height: 60px; padding: 8px 0\">\n<button type=\"button\" sc-camel-on-click=\"{{nav.home}}\" style=\"background: transparent; border: 0; padding: 4px 0; display: flex; align-items: baseline; gap: 10px; text-align: left\">\n<span class=\"serif\" style=\"font-size: 24px; color: #ece9e3\">Observatoire patrimonial<\u002Fspan>\n<span class=\"mono\" style=\"font-size: 11px; color: #8d969a\">OTVP · PNR de Brière<\u002Fspan>\n<\u002Fbutton>\n<div style=\"display: flex; gap: 6px; flex-wrap: wrap\" role=\"group\" aria-label=\"Dimension\">\n<button type=\"button\" class=\"{{nav.aCls}}\" sc-camel-on-click=\"{{nav.goA}}\">A · Le modèle<\u002Fbutton>\n<button type=\"button\" class=\"{{nav.bCls}}\" sc-camel-on-click=\"{{nav.goB}}\">B · Le territoire<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"flex: 1 1 20px\"><\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 6px; flex-wrap: wrap\" role=\"group\" aria-label=\"Profil\">\n<span style=\"font-size: 12px; color: #8d969a\">Profil<\u002Fspan>\n<sc-for list=\"{{nav.profs}}\" as=\"p\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"{{p.cls}}\" sc-camel-on-click=\"{{p.pick}}\">{{p.n}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{is.dimA}}\" hint-placeholder-val=\"{{false}}\">\n<nav style=\"border-bottom: 1px solid var(--line); padding: 0 20px\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center\">\n<span class=\"mono\" style=\"font-size: 11px; color: var(--mut); margin-right: 18px; padding: 12px 0\">{{nav.crumb}}<\u002Fspan>\n<sc-for list=\"{{nav.a}}\" as=\"n\" hint-placeholder-count=\"7\"><button type=\"button\" class=\"{{n.cls}}\" sc-camel-on-click=\"{{n.go}}\">{{n.n}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fsc-if>\n<sc-if value=\"{{is.dimB}}\" hint-placeholder-val=\"{{false}}\">\n<nav style=\"border-bottom: 1px solid var(--line); padding: 0 20px\">\n<div style=\"max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center\">\n<span class=\"mono\" style=\"font-size: 11px; color: var(--mut); margin-right: 18px; padding: 12px 0\">{{nav.crumb}}<\u002Fspan>\n<sc-for list=\"{{nav.b}}\" as=\"n\" hint-placeholder-count=\"5\"><button type=\"button\" class=\"{{n.cls}}\" sc-camel-on-click=\"{{n.go}}\">{{n.n}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fnav>\n<\u002Fsc-if>\n\n<main style=\"max-width: 1320px; margin: 0 auto; padding: 28px 20px 64px\">\n\n<!-- ================= ACCUEIL ================= -->\n<sc-if value=\"{{is.accueil}}\" hint-placeholder-val=\"{{true}}\">\n<section style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; margin-bottom: 30px\">\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<p class=\"mono\" style=\"margin: 0 0 10px; font-size: 12px; color: #8d969a; letter-spacing: .04em\">THÉORIE GÉNÉRALE DE L’OBSERVATION PATRIMONIALE · TERRAIN D’ESSAI<\u002Fp>\n<h1 class=\"serif\" style=\"margin: 0; font-size: clamp(40px, 6vw, 72px); line-height: 1.02\">Observer avant d’interpréter.<\u002Fh1>\n<p style=\"margin: 16px 0 0; font-size: 18px; color: #c4c8c9; max-width: 640px\">Deux entrées distinctes : le modèle théorique, indépendant de tout territoire, et son application au Parc naturel régional de Brière.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 1 380px; display: flex; flex-wrap: wrap; gap: 6px\">\n<span class=\"tag doc\">Document · Vol. I / II + page<\u002Fspan>\n<span class=\"tag obs\">Donnée observée 2024<\u002Fspan>\n<span class=\"tag ana\">Analyse du groupe<\u002Fspan>\n<span class=\"tag prop\">Proposition<\u002Fspan>\n<p style=\"margin: 6px 0 0; font-size: 12.5px; color: #8d969a\">Chaque élément porte son statut : ce qui vient des volumes, ce qui vient des données, ce qui relève de notre lecture.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-bottom: 34px\">\n<button type=\"button\" class=\"door\" sc-camel-on-click=\"{{nav.goA}}\" style=\"background: #161d22; border-color: #2e383e; color: #ece9e3\">\n<div style=\"display: flex; gap: 18px; align-items: center; flex-wrap: wrap\">\n<svg sc-camel-view-box=\"0 0 220 220\" width=\"170\" height=\"170\" aria-hidden=\"true\" style=\"flex: none\">\n<circle cx=\"110\" cy=\"110\" r=\"92\" fill=\"none\" stroke=\"#2b3439\"><\u002Fcircle>\n<circle cx=\"110\" cy=\"110\" r=\"52\" fill=\"none\" stroke=\"#2b3439\"><\u002Fcircle>\n<sc-for list=\"{{home.miniCar}}\" as=\"m\" hint-placeholder-count=\"12\"><circle cx=\"{{m.x}}\" cy=\"{{m.y}}\" r=\"5\" style=\"fill: {{m.f}}\"><\u002Fcircle><\u002Fsc-for>\n<sc-for list=\"{{home.miniDots}}\" as=\"m\" hint-placeholder-count=\"20\"><circle cx=\"{{m.x}}\" cy=\"{{m.y}}\" r=\"2.6\" style=\"fill: {{m.f}}\"><\u002Fcircle><\u002Fsc-for>\n<text x=\"110\" y=\"115\" text-anchor=\"middle\" style=\"fill: #ece9e3; font-size: 13px; font-family: 'IBM Plex Mono', monospace\">OTVP<\u002Ftext>\n<\u002Fsvg>\n<div style=\"flex: 1 1 200px\">\n<span class=\"mono\" style=\"font-size: 12px; color: #8d969a\">A · FOND SOMBRE<\u002Fspan>\n<h2 class=\"serif\" style=\"margin: 4px 0 8px; font-size: 34px; line-height: 1.05\">Comprendre le modèle<\u002Fh2>\n<p style=\"margin: 0; color: #c4c8c9; font-size: 14.5px\">6 valeurs · 12 caractères · 30 indicateurs · 119 propriétés requises · 4 relations · 8 opérateurs · 6 lois.<\u002Fp>\n<p class=\"mono\" style=\"margin: 10px 0 0; font-size: 11px; color: #8d969a\">Vol. I (T1–T11, chap. XI) · Vol. II (Annexes 1–5)<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbutton>\n<button type=\"button\" class=\"door\" sc-camel-on-click=\"{{nav.goB}}\" style=\"background: #f5f2eb; border-color: #dbd5c9; color: #1d2124\">\n<div style=\"display: flex; gap: 18px; align-items: center; flex-wrap: wrap\">\n<svg sc-camel-view-box=\"0 0 640 542\" width=\"190\" height=\"161\" aria-hidden=\"true\" style=\"flex: none\">\n<defs><clipPath id=\"homeclip\"><path d=\"{{atl.union}}\"><\u002Fpath><\u002FclipPath><\u002Fdefs>\n<g style=\"clip-path: url(#homeclip)\">\n<sc-for list=\"{{home.miniCells}}\" as=\"c\" hint-placeholder-count=\"20\"><rect x=\"{{c.x}}\" y=\"{{c.y}}\" width=\"{{c.s}}\" height=\"{{c.s}}\" style=\"fill: {{c.fill}}; fill-opacity: {{c.op}}\"><\u002Frect><\u002Fsc-for>\n<\u002Fg>\n<sc-for list=\"{{home.miniPaths}}\" as=\"p\" hint-placeholder-count=\"21\"><path d=\"{{p.d}}\" style=\"fill: none; stroke: #8d877b; stroke-width: 1.4\"><\u002Fpath><\u002Fsc-for>\n<\u002Fsvg>\n<div style=\"flex: 1 1 200px\">\n<span class=\"mono\" style=\"font-size: 12px; color: #5b605d\">B · FOND CLAIR<\u002Fspan>\n<h2 class=\"serif\" style=\"margin: 4px 0 8px; font-size: 34px; line-height: 1.05\">Explorer le PNR de Brière<\u002Fh2>\n<p style=\"margin: 0; color: #4a4f4c; font-size: 14.5px\">21 communes · {{home.nObs}} entités localisées issues de la base 2024 · couverture des 119 propriétés.<\u002Fp>\n<p class=\"mono\" style=\"margin: 10px 0 0; font-size: 11px; color: #5b605d\">INPN FR8000009 · geo.api.gouv.fr · base 2024 du studio<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsection>\n\n<section style=\"border-top: 1px solid #2b3439; padding-top: 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 560px; min-width: 0\">\n<h2 class=\"serif\" style=\"margin: 0 0 4px; font-size: 26px\">Qui consulte ?<\u002Fh2>\n<p style=\"margin: 0 0 14px; color: #a2a8aa; font-size: 14px\">Le profil change le point d’entrée et le niveau de détail des fiches ; la structure reste commune.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{home.profs}}\" as=\"p\" hint-placeholder-count=\"3\">\n<button type=\"button\" class=\"{{p.cls}}\" sc-camel-on-click=\"{{p.pick}}\">\n<div style=\"font-weight: 600; font-size: 15px\">{{p.n}}<\u002Fdiv>\n<div style=\"font-size: 13px; color: #a2a8aa; margin-top: 2px\">{{p.d}}<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px\">\n<h3 style=\"margin: 0 0 10px; font-size: 14px; font-weight: 500; color: #a2a8aa\">Parcours conseillé · {{home.profName}}<\u002Fh3>\n<ol style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{home.path}}\" as=\"s\" hint-placeholder-count=\"3\">\n<li><button type=\"button\" sc-camel-on-click=\"{{s.go}}\" class=\"ghost\" style=\"width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; border-radius: 8px; border-color: #2e383e; color: #ece9e3\">\n<span class=\"mono\" style=\"font-size: 12px; color: #8d969a\">{{s.i}} · {{s.d}}<\u002Fspan><span>{{s.n}}<\u002Fspan>\n<\u002Fbutton><\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{home.start}}\" style=\"margin-top: 12px; background: #ece9e3; color: #11161a\">Commencer le parcours<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ================= A0 RÉCIT ================= -->\n<sc-if value=\"{{is.a_recit}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<aside style=\"flex: 1 1 300px; max-width: 400px; min-width: 0\">\n<p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">ÉTAPE {{rc.num}} / 6<\u002Fp>\n<h1 class=\"serif\" style=\"margin: 6px 0 12px; font-size: 40px; line-height: 1.05\">{{rc.cur.t}}<\u002Fh1>\n<p style=\"margin: 0 0 12px; font-size: 15.5px; color: #cdd0d0\">{{rc.cur.p}}<\u002Fp>\n<span class=\"tag doc\">{{rc.cur.src}}<\u002Fspan>\n<div style=\"display: flex; gap: 8px; margin: 22px 0\">\n<sc-if value=\"{{rc.hasPrev}}\" hint-placeholder-val=\"{{false}}\"><button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{rc.prev}}\">Précédente<\u002Fbutton><\u002Fsc-if>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{rc.next}}\">{{rc.nextLabel}}<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column\">\n<sc-for list=\"{{rc.steps}}\" as=\"s\" hint-placeholder-count=\"6\"><button type=\"button\" class=\"{{s.cls}}\" sc-camel-on-click=\"{{s.pick}}\"><span class=\"mono\" style=\"font-size: 11px; margin-right: 8px\">0{{s.n}}<\u002Fspan>{{s.k}}<\u002Fbutton><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Faside>\n<div style=\"flex: 999 1 560px; min-width: 0\">\n<svg sc-camel-view-box=\"0 0 680 520\" style=\"width: 100%; height: auto; display: block\" role=\"img\" aria-label=\"Les 119 propriétés se regroupent en indicateurs, caractères puis valeurs\">\n<sc-if value=\"{{rc.showArcs}}\" hint-placeholder-val=\"{{false}}\">\n<g>\n<sc-for list=\"{{rc.arcs}}\" as=\"e\" hint-placeholder-count=\"10\">\n<g><title>{{e.tip}}<\u002Ftitle>\n<path d=\"{{e.d}}\" style=\"fill: none; stroke: {{e.c}}; stroke-width: {{e.w}}; stroke-dasharray: {{e.dash}}; stroke-linecap: round; opacity: .75\"><\u002Fpath>\n<sc-if value=\"{{e.isArrow}}\" hint-placeholder-val=\"{{true}}\"><polygon points=\"{{e.arrow}}\" style=\"fill: {{e.c}}; opacity: .85\"><\u002Fpolygon><\u002Fsc-if>\n<sc-if value=\"{{e.isBar}}\" hint-placeholder-val=\"{{false}}\"><line x1=\"{{e.bx1}}\" y1=\"{{e.by1}}\" x2=\"{{e.bx2}}\" y2=\"{{e.by2}}\" style=\"stroke: {{e.c}}; stroke-width: 2.5; stroke-linecap: round\"><\u002Fline><\u002Fsc-if>\n<\u002Fg>\n<\u002Fsc-for>\n<\u002Fg>\n<\u002Fsc-if>\n<sc-for list=\"{{rc.dots}}\" as=\"d\" hint-placeholder-count=\"119\">\n<g style=\"{{d.tr}}; transition: transform .9s cubic-bezier(.2,.7,.2,1)\"><title>{{d.tip}}<\u002Ftitle><circle cx=\"0\" cy=\"0\" r=\"{{d.r}}\" style=\"fill: {{d.f}}; stroke: #11161a; stroke-width: 1.2; transition: fill .6s\"><\u002Fcircle><\u002Fg>\n<\u002Fsc-for>\n<sc-for list=\"{{rc.labels}}\" as=\"l\" hint-placeholder-count=\"6\">\n<text x=\"{{l.x}}\" y=\"{{l.y}}\" text-anchor=\"{{l.a}}\" style=\"fill: {{l.f}}; font-size: {{l.sz}}px; font-family: 'IBM Plex Sans', sans-serif\">{{l.t}}<\u002Ftext>\n<\u002Fsc-for>\n<\u002Fsvg>\n<p style=\"margin: 6px 0 0; font-size: 12.5px; color: var(--mut)\">Chaque point = une propriété patrimoniale requise du Volume II. Survoler un point affiche son code et son intitulé. Couleur = valeur (toujours nommée à l’écran).<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= A1 ÉCHELLE ================= -->\n<sc-if value=\"{{is.a_echelle}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 18px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Neuf niveaux, aucun saut<\u002Fh1>\n<span class=\"tag doc\">Vol. I, T1, p. 158 · opérations p. 159<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 22px; max-width: 760px; color: #cdd0d0\">« Chaque niveau est nécessaire et irréductible » (p. 159). La hiérarchie n’est « ni une chronologie, ni un pipeline informatique, ni une simple classification ».<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px\">\n<div style=\"flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n< 860 860\" style=\"width: 100%; height: auto; display: block; max-width: 860px; margin: 0 auto\" role=\"img\" aria-label=\"Six valeurs au centre, douze caractères, trente indicateurs et cent dix-neuf propriétés en couronne\">\n<circle cx=\"430\" cy=\"430\" r=\"262\" style=\"fill: none; stroke: #222b30\"><\u002Fcircle>\n<circle cx=\"430\" cy=\"430\" r=\"206\" style=\"fill: none; stroke: #222b30; stroke-dasharray: 2 4\"><\u002Fcircle>\n<circle cx=\"430\" cy=\"430\" r=\"146\" style=\"fill: none; stroke: #222b30; stroke-dasharray: 2 4\"><\u002Fcircle>\n<sc-for list=\"{{cs.spokes}}\" as=\"s\" hint-placeholder-count=\"10\"><line x1=\"{{s.x1}}\" y1=\"{{s.y1}}\" x2=\"{{s.x2}}\" y2=\"{{s.y2}}\" style=\"stroke: {{s.c}}; stroke-width: {{s.w}}\"><\u002Fline><\u002Fsc-for>\n<sc-for list=\"{{cs.vals}}\" as=\"v\" hint-placeholder-count=\"6\">\n<g class=\"svgbtn\" sc-camel-on-click=\"{{v.pick}}\"><title>{{v.t}}<\u002Ftitle>\n<circle cx=\"{{v.x}}\" cy=\"{{v.y}}\" r=\"15\" style=\"fill: {{v.f}}; stroke: #11161a; stroke-width: 2\"><\u002Fcircle>\n<text x=\"{{v.x}}\" y=\"{{v.y}}\" dy=\"4\" text-anchor=\"middle\" style=\"fill: #11161a; font-size: 10px; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">{{v.ab}}<\u002Ftext>\n<\u002Fg>\n<\u002Fsc-for>\n<sc-for list=\"{{cs.cars}}\" as=\"c\" hint-placeholder-count=\"12\">\n<circle cx=\"{{c.x}}\" cy=\"{{c.y}}\" r=\"7\" style=\"fill: {{c.f}}; stroke: #11161a; stroke-width: 2\"><\u002Fcircle>\n<text x=\"{{c.lx}}\" y=\"{{c.ly}}\" text-anchor=\"{{c.anchor}}\" style=\"fill: #dcdad4; font-size: 12px; font-family: 'IBM Plex Sans', sans-serif; paint-order: stroke; stroke: #11161a; stroke-width: 3px\">{{c.t}}<\u002Ftext>\n<\u002Fsc-for>\n<sc-for list=\"{{cs.inds}}\" as=\"i\" hint-placeholder-count=\"30\">\n<g class=\"svgbtn\" sc-camel-on-click=\"{{i.pick}}\"><title>Indicateur : {{i.t}}<\u002Ftitle>\n<circle cx=\"{{i.x}}\" cy=\"{{i.y}}\" r=\"{{i.r}}\" style=\"fill: #11161a; stroke: {{i.f}}; stroke-width: 2\"><\u002Fcircle>\n<text transform=\"{{i.lt}}\" text-anchor=\"{{i.anchor}}\" dy=\"3\" style=\"fill: {{i.lf}}; font-weight: {{i.lw}}; font-size: 10px; font-family: 'IBM Plex Sans', sans-serif\">{{i.t}}<\u002Ftext>\n<\u002Fg>\n<\u002Fsc-for>\n<sc-for list=\"{{cs.dots}}\" as=\"d\" hint-placeholder-count=\"119\">\n<g class=\"svgbtn\" sc-camel-on-click=\"{{d.pick}}\" style=\"opacity: {{d.op}}\"><title>{{d.tip}}<\u002Ftitle>\n<circle cx=\"{{d.x}}\" cy=\"{{d.y}}\" r=\"10\" style=\"fill: transparent\"><\u002Fcircle>\n<circle cx=\"{{d.x}}\" cy=\"{{d.y}}\" r=\"{{d.r}}\" style=\"fill: {{d.f}}; stroke: #11161a; stroke-width: 1.5\"><\u002Fcircle>\n<sc-if value=\"{{d.ring}}\" hint-placeholder-val=\"{{false}}\"><circle cx=\"{{d.x}}\" cy=\"{{d.y}}\" r=\"12\" style=\"fill: none; stroke: #ece9e3; stroke-width: 1.5\"><\u002Fcircle><\u002Fsc-if>\n<\u002Fg>\n<\u002Fsc-for>\n<text x=\"430\" y=\"434\" text-anchor=\"middle\" style=\"fill: #8d969a; font-size: 11px; font-family: 'IBM Plex Mono', monospace\">OTVP<\u002Ftext>\n<\u002Fsvg>\n<p style=\"margin: 0; font-size: 12.5px; color: var(--mut); text-align: center\">Du centre vers l’extérieur : valeur → caractère → indicateur → propriété. Cliquer un point, un indicateur ou une valeur.<\u002Fp>\n<\u002Fdiv>\n\n<aside style=\"flex: 1 1 340px; min-width: 0; max-width: 480px\">\n<sc-if value=\"{{cs.hasSel}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"card\" style=\"padding: 18px 20px; border-top: 3px solid {{cs.fiche.col}}\">\n<div style=\"display: flex; justify-content: space-between; gap: 8px; align-items: flex-start\">\n<p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">{{cs.fiche.code}} · {{cs.fiche.v}} › {{cs.fiche.c}} › {{cs.fiche.i}}<\u002Fp>\n<button type=\"button\" class=\"lnk\" sc-camel-on-click=\"{{cs.fiche.close}}\" style=\"font-size: 12px; color: var(--mut)\">Fermer<\u002Fbutton>\n<\u002Fdiv>\n<h2 class=\"serif\" style=\"margin: 4px 0 10px; font-size: 30px; line-height: 1.1\">{{cs.fiche.n}}<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px\">\n<span class=\"tag doc\">Vol. II, Annexe 2, p. {{cs.fiche.pg}}<\u002Fspan>\n<span class=\"tag doc\">Type : {{cs.fiche.t}} · Annexe 4, p. {{cs.fiche.tp}}<\u002Fspan>\n<\u002Fdiv>\n<dl class=\"kv\">\n<sc-for list=\"{{cs.fiche.fields}}\" as=\"f\" hint-placeholder-count=\"3\"><dt>{{f.k}}<\u002Fdt><dd>{{f.v}}<\u002Fdd><\u002Fsc-for>\n<\u002Fdl>\n<sc-if value=\"{{cs.notFull}}\" hint-placeholder-val=\"{{true}}\"><button type=\"button\" class=\"lnk\" sc-camel-on-click=\"{{cs.showFull}}\" style=\"margin-top: 10px; font-size: 13px\">Afficher les 16 rubriques de la fiche<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{cs.fiche.hasNote}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 12px 0 0; font-size: 13px; padding: 10px 12px; background: var(--chip); border-radius: 6px\">{{cs.fiche.note}}<\u002Fp><\u002Fsc-if>\n<sc-if value=\"{{cs.fiche.hasProto}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 12px 0 0; font-size: 13px\">Protocoles mobilisés (exemple du volume) : <span class=\"mono\">{{cs.fiche.proto}}<\u002Fspan> <span class=\"tag doc\">Annexe 3, §15, pp. 88–89<\u002Fspan><\u002Fp><\u002Fsc-if>\n<div style=\"margin-top: 14px\">\n<p style=\"margin: 0 0 6px; font-size: 12.5px; color: var(--mut)\">Même indicateur<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 5px\"><sc-for list=\"{{cs.fiche.siblings}}\" as=\"s\" hint-placeholder-count=\"4\"><button type=\"button\" class=\"{{s.cls}}\" sc-camel-on-click=\"{{s.pick}}\"><span class=\"mono\">{{s.c}}<\u002Fspan> {{s.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line)\">\n<p style=\"margin: 0 0 6px; font-size: 13.5px\">{{cs.fiche.bText}} <span class=\"tag prop\">Proposition de recodage<\u002Fspan><\u002Fp>\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{cs.fiche.goB}}\" style=\"font-size: 13px\">Voir dans le PNR de Brière →<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top: 14px\">\n<button type=\"button\" class=\"lnk\" sc-camel-on-click=\"{{cs.toggleVolI}}\" style=\"font-size: 13px\">{{cs.volILabel}}<\u002Fbutton>\n<sc-if value=\"{{cs.volI}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"margin-top: 10px; font-size: 13px\">\n<p style=\"margin: 0 0 6px; color: var(--mut)\">Caractères de la valeur {{cs.fiche.v}} au Vol. I <span class=\"tag doc\">T3, pp. 163–165<\u002Fspan><\u002Fp>\n<sc-for list=\"{{cs.fiche.vol1.cars}}\" as=\"c\" hint-placeholder-count=\"2\"><p style=\"margin: 0 0 6px\"><strong style=\"font-weight: 600\">{{c.n}}<\u002Fstrong> — {{c.d}} <em style=\"color: var(--mut)\">{{c.q}}<\u002Fem><\u002Fp><\u002Fsc-for>\n<p style=\"margin: 8px 0 4px; color: var(--mut)\">Indicateurs au Vol. I <span class=\"tag doc\">T4 bis, pp. 168–169<\u002Fspan><\u002Fp>\n<sc-for list=\"{{cs.fiche.vol1.inds}}\" as=\"x\" hint-placeholder-count=\"2\"><p style=\"margin: 0 0 3px\">{{x.c}} : {{x.i}}<\u002Fp><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{cs.hasInd}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"card\" style=\"padding: 18px 20px; border-top: 3px solid {{cs.ind.col}}\">\n<div style=\"display: flex; justify-content: space-between\"><p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">INDICATEUR · {{cs.ind.v}} › {{cs.ind.c}}<\u002Fp><button type=\"button\" class=\"lnk\" sc-camel-on-click=\"{{cs.ind.close}}\" style=\"font-size: 12px; color: var(--mut)\">Fermer<\u002Fbutton><\u002Fdiv>\n<h2 class=\"serif\" style=\"margin: 4px 0 6px; font-size: 30px\">{{cs.ind.n}}<\u002Fh2>\n<p style=\"margin: 0 0 12px; font-size: 13px; color: var(--mut)\">{{cs.ind.k}} propriétés requises <span class=\"tag doc\">Vol. II, Annexe 1<\u002Fspan><\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{cs.ind.props}}\" as=\"p\" hint-placeholder-count=\"4\">\n<button type=\"button\" class=\"sib\" sc-camel-on-click=\"{{p.pick}}\" style=\"padding: 8px 10px\"><span class=\"mono\" style=\"font-size: 11px; color: var(--mut)\">{{p.c}} · {{p.t}}<\u002Fspan><br><span style=\"font-weight: 500\">{{p.n}}<\u002Fspan><br><span style=\"color: var(--mut)\">{{p.q}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{cs.none}}\" hint-placeholder-val=\"{{true}}\">\n<div class=\"card\" style=\"padding: 18px 20px; border-top: 3px solid {{cs.val.col}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 10px\"><sc-for list=\"{{cs.val.tabs}}\" as=\"t\" hint-placeholder-count=\"6\"><button type=\"button\" class=\"{{t.cls}}\" sc-camel-on-click=\"{{t.pick}}\"><span style=\"{{t.bar}}; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px\"><\u002Fspan>{{t.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<h2 class=\"serif\" style=\"margin: 0 0 4px; font-size: 32px\">{{cs.val.n}}<\u002Fh2>\n<p class=\"serif\" style=\"margin: 0 0 10px; font-size: 20px; font-style: italic; color: #cdd0d0\">« {{cs.val.q}} »<\u002Fp>\n<p style=\"margin: 0 0 10px; font-size: 14px\">{{cs.val.def}}<\u002Fp>\n<dl class=\"kv\"><dt>Objet<\u002Fdt><dd>{{cs.val.objet}}<\u002Fdd><dt>Manifestation<\u002Fdt><dd>{{cs.val.man}}<\u002Fdd><dt>Propriétés<\u002Fdt><dd>{{cs.val.k}} (Vol. II)<\u002Fdd><\u002Fdl>\n<span class=\"tag doc\" style=\"margin-top: 10px\">Vol. I, T2, pp. 160–161<\u002Fspan>\n<div style=\"margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px\">\n<sc-for list=\"{{cs.val.cars}}\" as=\"c\" hint-placeholder-count=\"2\"><p style=\"margin: 0 0 8px; font-size: 13.5px\"><strong style=\"font-weight: 600\">{{c.n}}<\u002Fstrong><br><span style=\"color: var(--mut)\">{{c.inds}}<\u002Fspan><\u002Fp><\u002Fsc-for>\n<span class=\"tag doc\">Vol. II, Annexe 1<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= A3 RELATIONS ================= -->\n<sc-if value=\"{{is.a_re t: 600\">{{l.n}}<\u002Fstrong> · <em>{{l.verbe}}<\u002Fem> — {{l.sens}} <span class=\"mono\" style=\"font-size: 11px; color: var(--mut)\">axe de {{l.axe}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{rel.hasNode}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"card\" style=\"padding: 16px 18px; border-top: 3px solid {{rel.node.col}}\">\n<div style=\"display: flex; justify-content: space-between\"><h2 class=\"serif\" style=\"margin: 0; font-size: 28px\">{{rel.node.n}}<\u002Fh2><button type=\"button\" class=\"lnk\" sc-camel-on-click=\"{{rel.node.clear}}\" style=\"font-size: 12px; color: var(--mut)\">Tout afficher<\u002Fbutton><\u002Fdiv>\n<p class=\"serif\" style=\"margin: 2px 0 10px; font-style: italic; font-size: 18px; color: #cdd0d0\">« {{rel.node.q}} »<\u002Fp>\n<p style=\"margin: 0 0 6px; font-size: 12.5px; color: var(--mut)\">Agit sur (ligne de la matrice)<\u002Fp>\n<sc-for list=\"{{rel.node.out}}\" as=\"o\" hint-placeholder-count=\"5\"><p style=\"margin: 0 0 4px; font-size: 13.5px\">→ <span style=\"color: {{o.col}}\">●<\u002Fspan> {{o.t}} : <strong style=\"font-weight: 600\">{{o.r}}<\u002Fstrong> <em style=\"color: var(--mut)\">({{o.v}})<\u002Fem><\u002Fp><\u002Fsc-for>\n<p style=\"margin: 10px 0 6px; font-size: 12.5px; color: var(--mut)\">Reçoit de (colonne)<\u002Fp>\n<sc-for list=\"{{rel.node.inn}}\" as=\"o\" hint-placeholder-count=\"5\"><p style=\"margin: 0 0 4px; font-size: 13.5px\">← <span style=\"color: {{o.col}}\">●<\u002Fspan> {{o.s}} : <strong style=\"font-weight: 600\">{{o.r}}<\u002Fstrong> <em style=\"color: var(--mut)\">({{o.v}})<\u002Fem><\u002Fp><\u002Fsc-for>\n<p style=\"margin: 10px 0 0; font-size: 12px; color: var(--mut)\"><span class=\"tag ana\">Analyse du groupe<\u002Fspan> Sens lu « ligne → colonne » ; l’exemple de l’auteur (l’ancienneté conditionne l’histoire, p. 173) correspond à la cellule Ancienneté → Histoire… qui porte « Renforcement » dans la matrice. Point à clarifier avec l’auteur.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{rel.noNode}}\" hint-placeholder-val=\"{{true}}\">\n<p style=\"margin: 0; font-size: 13.5px; color: var(--mut)\">Cliquer une valeur pour isoler ses relations sortantes (pleines) et entrantes (atténuées).<\u002Fp>\n<\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<h2 style=\"margin: 26px 0 8px; font-size: 16px; font-weight: 600\">Lecture textuelle de la matrice T6 <span class=\"tag doc\">Vol. I, pp. 172–173<\u002Fspan><\u002Fh2>\n<div style=\"overflow-x: auto\">\n<sc-raw-table style=\"border-collapse: collapse; min-width: 760px; width: 100%\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th class=\"mcell\" style=\"text-align: left\">Ligne → colonne<\u002Fsc-raw-th><sc-for list=\"{{rel.heads}}\" as=\"h\" hint-placeholder-count=\"6\"><sc-raw-th class=\"mcell\" style=\"color: {{h.col}}; font-weight: 600\">{{h.n}}<\u002Fsc-raw-th><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{rel.matrix}}\" as=\"r\" hint-placeholder-count=\"6\"><sc-raw-tr><sc-raw-th class=\"mcell\" style=\"text-align: left; color: {{r.col}}; font-weight: 600\">{{r.n}}<\u002Fsc-raw-th><sc-for list=\"{{r.cells}}\" as=\"c\" hint-placeholder-count=\"6\"><sc-raw-td class=\"{{c.cls}}\">{{c.t}}<\u002Fsc-raw-td><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<ul style=\"margin: 12px 0 0; padding-left: 18px; font-size: 13px; color: var(--mut)\"><sc-for list=\"{{rel.notes}}\" as=\"n\" hint-placeholder-count=\"3\"><li>{{n}}<\u002Fli><\u002Fsc-for><\u002Ful>\n<\u002Fsc-if>\n<sc-if value=\"{{rel.tabC}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Relations constitutives (internes à une valeur) <span class=\"tag doc\">T7A, p. 176<\u002Fspan><\u002Fh2>\n<sc-for list=\"{{rel.t7a}}\" as=\"r\" hint-placeholder-count=\"6\">\n<div class=\"card\" style=\"padding: 10px 14px; margin-bottom: 6px; border-left: 3px solid {{r.col}}\"><div style=\"font-size: 14px\"><strong style=\"font-weight: 600\">{{r.a}}<\u002Fstrong> ↔ <strong style=\"font-weight: 600\">{{r.b}}<\u002Fstrong> <span style=\"color: var(--mut)\">· {{r.v}}<\u002Fspan><\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">{{r.f}}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<p style=\"margin: 8px 0 0; font-size: 12.5px; color: var(--mut)\">Noms des caractères du Vol. I (T3). Le Vol. II renomme ceux de l’Histoire et de la Mémoire : voir Sources et divergences.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Relations transversales principales <span class=\"tag doc\">T7B, pp. 176–177<\u002Fspan><\u002Fh2>\n<div style=\"overflow-x: auto\"><sc-raw-table class=\"tbl\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Source<\u002Fsc-raw-th><sc-raw-th>Cible<\u002Fsc-raw-th><sc-raw-th>Relation<\u002Fsc-raw-th><sc-raw-th>Justification<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{rel.t7b}}\" as=\"r\" hint-placeholder-count=\"11\"><sc-raw-tr><sc-raw-td>{{r.s}}<\u002Fsc-raw-td><sc-raw-td>{{r.t}}<\u002Fsc-raw-td><sc-raw-td>{{r.r}}<\u002Fsc-raw-td><sc-raw-td style=\"color: var(--mut)\">{{r.j}}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<p style=\"margin: 10px 0 0; font-size: 13px; padding: 8px 12px; border-left: 3px solid #c98500\">{{rel.t7note}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<!-- ================= A4 DYNAMIQUE ================= -->\n<sc-if value=\"{{is.a_dyn}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 8px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">De la relation à l’action<\u002Fh1>\n<span class=\"tag doc\">Vol. I, T5 · T9 · T10 · T11, pp. 170–186<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 20px; max-width: 780px; color: #cdd0d0\">« Les acteurs n’agissent jamais directement sur les formes patrimoniales. Ils agissent sur les relations entre ces formes » (p. 186).<\u002Fp>\n<div class=\"drow\" style=\"background: transparent; border: 0; padding: 0 14px 6px; color: var(--mut); font-size: 12px\" aria-hidden=\"true\"><span>Relation (T5)<\u002Fspan><span>Forme normative (T9)<\u002Fspan><span>Opérateurs (T10)<\u002Fspan><span>Effet sur le système (T11)<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px\">\n<sc-for list=\"{{dyn.rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<button type=\"button\" class=\"{{r.cls}}\" sc-camel-on-click=\"{{r.pick}}\"><span style=\"font-weight: 600\">{{r.rel}}<\u002Fspan><span>→ {{r.forme}}<\u002Fspan><span class=\"serif\" style=\"font-size: 18px; font-style: italic\">{{r.ops}}<\u002Fspan><span style=\"color: var(--mut)\">{{r.eff}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px\">\n<div class=\"card\" style=\"flex: 1 1 380px; padding: 18px 20px\">\n<h2 class=\"serif\" style=\"margin: 0 0 8px; font-size: 28px\">{{dyn.cur.rel}} → {{dyn.cur.forme}}<\u002Fh2>\n<dl class=\"kv\">\n<dt>Définition (T5)<\u002Fdt><dd>{{dyn.cur.def}}<\u002Fdd>\n<dt>Effet sur la forme cible<\u002Fdt><dd>{{dyn.cur.effet}} · déterminant : {{dyn.cur.det}}<\u002Fdd>\n<dt>Question<\u002Fdt><dd>{{dyn.cur.q}}<\u002Fdd>\n<dt>Exemple du traité<\u002Fdt><dd>{{dyn.cur.ex}}<\u002Fdd>\n<dt>Verbe (T5 bis)<\u002Fdt><dd><em>{{dyn.cur.verbe}}<\u002Fem> — {{dyn.cur.sens}}<\u002Fdd>\n<dt>Nature (T9)<\u002Fdt><dd>{{dyn.cur.nature}}<\u002Fdd>\n<dt>Objet de l’action (T11)<\u002Fdt><dd>{{dyn.cur.objet}}<\u002Fdd>\n<\u002Fdl>\n<\u002Fdiv>\n<div class=\"card\" style=\"flex: 1 1 380px; padding: 18px 20px\">\n<p style=\"margin: 0 0 10px; font-size: 13px; color: var(--mut)\">Opérateurs de la forme {{dyn.cur.forme}} <span class=\"tag doc\">T10, pp. 182–183<\u002Fspan><\u002Fp>\n<sc-for list=\"{{dyn.cur.ops}}\" as=\"o\" hint-placeholder-count=\"2\">\n<div style=\"margin-bottom: 10px\"><div class=\"serif\" style=\"font-size: 22px; font-style: italic\">{{o.n}}<\u002Fdiv><div style=\"font-size: 13.5px\">{{o.d}}<\u002Fdiv><div class=\"mono\" style=\"font-size: 11px; color: var(--mut)\">effet : {{o.e}} · résultat : {{o.r}}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; margin-top: 24px\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Niveaux d’action des opérateurs <span class=\"tag doc\">T10 bis, p. 183<\u002Fspan><\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{dyn.levels}}\" as=\"l\" hint-placeholder-count=\"4\"><div class=\"card\" style=\"padding: 10px 12px\"><div class=\"mono\" style=\"font-size: 11px; color: var(--mut)\">{{l.i}}<\u002Fdiv><div style=\"font-weight: 600\">{{l.n}}<\u002Fdiv><div class=\"serif\" style=\"font-style: italic; font-size: 16px\">{{l.ops}}<\u002Fdiv><div style=\"font-size: 12.5px; color: var(--mut)\">{{l.e}}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">L’opérateur n’est pas l’action <span class=\"tag doc\">Vol. I, pp. 181–182<\u002Fspan><\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px\">\n<sc-for list=\"{{dyn.chain}}\" as=\"c\" hint-placeholder-count=\"5\"><span class=\"card\" style=\"padding: 6px 12px; font-size: 14px\">{{c.n}}<\u002Fspan><sc-if value=\"{{c.notLast}}\" hint-placeholder-val=\"{{true}}\"><span style=\"color: var(--mut)\">→<\u002Fspan><\u002Fsc-if><\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 10px 0 0; font-size: 13px; color: var(--mut)\">{{dyn.actNote}}<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 26px\">\n<h2 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 600\">Deux distinctions de l’auteur, croisées <span class=\"tag prop\">Proposition<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0 0 12px; font-size: 13px; color: var(--mut)\">Axes production / régulation (p. 171) × familles transformation / modulation (p. 180). Le croisement en tableau est une proposition de lecture, il n’est pas dans le traité.<\u002Fp>\n<div style=\"overflow-x: auto\"><sc-raw-table class=\"tbl\" style=\"max-width: 720px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th>Transformation (change l’état du système)<\u002Fsc-raw-th><sc-raw-th>Modulation (change le niveau ou la durée)<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-th>Axe de production<\u002Fsc-raw-th><sc-raw-td>Condition → Possibilité<br><em>permettre, favoriser<\u002Fem><\u002Fsc-raw-td><sc-raw-td>Renforcement → Intensité<br><em>amplifier<\u002Fem><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-th>Axe de régulation<\u002Fsc-raw-th><sc-raw-td>Limitation → Conflit<br><em>borner, altérer, menacer, annihiler<\u002Fem><\u002Fsc-raw-td><sc-raw-td>Continuité → Stabilité<br><em>entretenir<\u002Fem><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= A5 LOIS ================= -->\n<sc-if value=\"{{is.a_lois}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 20px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Six lois<\u002Fh1>\n<span class=\"tag doc\">Vol. I, chapitre XI, pp. 130–143<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px\">\n<sc-for list=\"{{lois}}\" as=\"l\" hint-placeholder-count=\"6\">\n<article class=\"card\" style=\"padding: 20px\">\n<div class=\"serif\" style=\"font-size: 44px; line-height: 1; color: var(--mut)\">{{l.num}}<\u002Fdiv>\n<h2 style=\"margin: 8px 0 8px; font-size: 16px; font-weight: 600\">{{l.n}}<\u002Fh2>\n<p class=\"serif\" style=\"margin: 0 0 12px; font-size: 19px; line-height: 1.3\">« {{l.s}} »<\u002Fp>\n<span class=\"tag doc\">Vol. I, p. {{l.pg}}<\u002Fspan>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= A6 SOURCES ================= -->\n<sc-if value=\"{{is.a_sources}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 8px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Sources, divergences, règles<\u002Fh1>\n<\u002Fdiv>\n<p style=\"margin: 0 0 20px; max-width: 820px; color: #cdd0d0\">Choix validé : le Volume II fait foi pour l’observation (30 indicateurs, 119 propriétés), le Volume I pour les relations (T5–T11). Les écarts sont montrés, pas résolus.<\u002Fp>\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Divergences repérées<\u002Fh2>\n<div style=\"overflow-x: auto; margin-bottom: 26px\"><sc-raw-table class=\"tbl\" style=\"min-width: 760px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Objet<\u002Fsc-raw-th><sc-raw-th>Volume I<\u002Fsc-raw-th><sc-raw-th>Volume II<\u002Fsc-raw-th><sc-raw-th>Lecture<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{src.div}}\" as=\"d\" hint-placeholder-count=\"8\"><sc-raw-tr><sc-raw-td style=\"font-weight: 600\">{{d.k}}<\u002Fsc-raw-td><sc-raw-td>{{d.vI}}<\u002Fsc-raw-td><sc-raw-td>{{d.vII}}<\u002Fsc-raw-td><sc-raw-td>{{d.l}} <sc-if value=\"{{d.interp}}\" hint-placeholder-val=\"{{false}}\"><span class=\"tag ana\">Analyse du groupe<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Règles qui contraignent l’interface<\u002Fh2>\n<sc-for list=\"{{src.rules}}\" as=\"r\" hint-placeholder-count=\"4\"><div class=\"card\" style=\"padding: 10px 14px; margin-bottom: 6px\"><div style=\"font-size: 14px\">{{r.t}}<\u002Fdiv><span class=\"tag doc\" style=\"margin-top: 6px\">{{r.ref}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<p style=\"margin: 10px 0 0; font-size: 13px; color: var(--mut)\"><span class=\"tag ana\">Analyse du groupe<\u002Fspan> Conséquence : aucune note, aucun score, aucun radar dans le prototype. Les cartes montrent des présences et des densités d’entités, jamais une « intensité patrimoniale ».<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<h2 style=\"margin: 0 0 6px; font-size: 16px; font-weight: 600\">Protocoles d’observation par valeur <span class=\"tag doc\">Annexe 3, §2 p. 80 · §14 p. 88<\u002Fspan><\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 12.5px\"><sc-for list=\"{{src.chaine}}\" as=\"c\" hint-placeholder-count=\"5\"><span>{{c.n}}<\u002Fspan><sc-if value=\"{{c.notLast}}\" hint-placeholder-val=\"{{true}}\"><span style=\"color: var(--mut)\">→<\u002Fspan><\u002Fsc-if><\u002Fsc-for><\u002Fdiv>\n<div style=\"overflow-x: auto\"><sc-raw-table class=\"tbl\" style=\"min-width: 520px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Protocole<\u002Fsc-raw-th><sc-for list=\"{{src.heads}}\" as=\"h\" hint-placeholder-count=\"6\"><sc-raw-th style=\"text-align: center; color: {{h.col}}\" title=\"{{h.n}}\">{{h.ab}}<\u002Fsc-raw-th><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{src.proto}}\" as=\"p\" hint-placeholder-count=\"8\"><sc-raw-tr><sc-raw-td><span class=\"mono\">{{p.c}}<\u002Fspan> {{p.n}}<br><span style=\"color: var(--mut); font-size: 12px\">{{p.d}}<\u002Fspan><\u002Fsc-raw-td><sc-for list=\"{{p.cells}}\" as=\"c\" hint-placeholder-count=\"6\"><sc-raw-td style=\"text-align: center\"><sc-if value=\"{{c.on}}\" hint-placeholder-val=\"{{true}}\"><span style=\"color: {{c.col}}\" aria-label=\"mobilisable\">●<\u002Fspan><\u002Fsc-if><sc-if value=\"{{c.off}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color: var(--mut)\" aria-label=\"non indiqué\">·<\u002Fspan><\u002Fsc-if><\u002Fsc-raw-td><\u002Fsc-for><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table><\u002Fdiv>\n<p style=\"margin: 8px 0 0; font-size: 12.5px; color: var(--mut)\">« Matrice de mobilisation potentielle, et non obligation » (p. 88). Exemples détaillés : <sc-for list=\"{{src.ex}}\" as=\"x\" hint-placeholder-count=\"4\"><span class=\"mono\">{{x.c}}<\u002Fspan> ({{x.p}}) · <\u002Fsc-for><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= B1 COUVERTURE ================= -->\n<sc-if value=\"{{is.b_cov}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 8px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Ce que la base 2024 permet d’observer<\u002Fh1>\n<span class=\"tag obs\">Donnée observée 2024<\u002Fspan><span class=\"tag prop\">Recodage : proposition<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 18px; max-width: 820px; color: var(--mut)\">Les mêmes 119 propriétés que dans le modèle. Une propriété est « renseignée » lorsqu’au moins une entité de la base 2024, située dans les 21 communes, lui correspond selon notre proposition de recodage. Il s’agit d’une couverture, pas d’une évaluation.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; margin-bottom: 14px\">\n<div><div class=\"serif\" style=\"font-size: 52px; line-height: 1\">{{cov.k32}}<span style=\"font-size: 26px; color: var(--mut)\"> / 119<\u002Fspan><\u002Fdiv><div style=\"font-size: 13px; color: var(--mut)\">propriétés renseignées (correspondance forte ou moyenne)<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px\">\n<span style=\"display: flex; gap: 6px; align-items: center\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"6\" style=\"fill: #1d2124\"><\u002Fcircle><\u002Fsvg>forte · {{cov.k3}}<\u002Fspan>\n<span style=\"display: flex; gap: 6px; align-items: center\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"6\" style=\"fill: #1d2124; fill-opacity: .45; stroke: #1d2124\"><\u002Fcircle><\u002Fsvg>moyenne · {{cov.k2}}<\u002Fspan>\n<span style=\"display: flex; gap: 6px; align-items: center\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"5.5\" style=\"fill: #f5f2eb; stroke: #1d2124; stroke-width: 2\"><\u002Fcircle><\u002Fsvg>faible ou à discuter · {{cov.k1}}<\u002Fspan>\n<span style=\"display: flex; gap: 6px; align-items: center\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><circle cx=\"7\" cy=\"7\" r=\"6\" style=\"fill: #f5f2eb; stroke: #c3bcae; stroke-dasharray: 2 2\"><\u002Fcircle><\u002Fsvg>aucune donnée · {{cov.k0}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 999 1 560px; min-width: 0\">\n<svg sc-camel-view-box=\"0 0 620 270\" style=\"width: 100%; height: auto; display: block\" role=\"img\" aria-label=\"Grille des 119 propriétés selon leur couverture par la base 2024\">\n<sc-for list=\"{{cov.dots}}\" as=\"d\" hint-placeholder-count=\"119\">\n<g class=\"svgbtn\" sc-camel-on-click=\"{{d.pick}}\"><title>{{d.tip}}<\u002Ftitle>\n<circle cx=\"{{d.x}}\" cy=\"{{d.y}}\" r=\"{{d.r}}\" style=\"fill: {{d.fill}}; fill-opacity: {{d.fop}}; stroke: {{d.stroke}}; stroke-width: {{d.sw}}; stroke-dasharray: {{d.dash}}\"><\u002Fcircle>\n<sc-if value=\"{{d.ring}}\" hint-placeholder-val=\"{{false}}\"><circle cx=\"{{d.x}}\" cy=\"{{d.y}}\" r=\"14\" style=\"fill: none; stroke: #1d2124; stroke-width: 1.5\"><\u002Fcircle><\u002Fsc-if>\n<\u002Fg>\n<\u002Fsc-for>\n<\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; gap: 8px; margin-top: 16px\">\n<sc-for list=\"{{cov.byVal}}\" as=\"v\" hint-placeholder-count=\"6\">\n<div style=\"display: grid; grid-template-columns: 110px minmax(0, 1fr) 120px; gap: 12px; align-items: center; font-size: 13.5px\">\n<span style=\"display: flex; align-items: center; gap: 6px\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{v.col}}\"><\u002Fspan>{{v.n}}<\u002Fspan>\n<div style=\"display: flex; gap: 2px; height: 12px; background: #ebe6db; border-radius: 3px; overflow: hidden\">\n<div style=\"{{v.w3}}; background: {{v.col}}\"><\u002Fdiv><div style=\"{{v.w2}}; background: {{v.col}}; opacity: .45\"><\u002Fdiv><div style=\"{{v.w1}}; box-shadow: inset 0 0 0 2px {{v.col}}\"><\u002Fdiv>\n<\u002Fdiv>\n<span class=\"mono\" style=\"font-size: 12px; color: var(--mut)\">{{v.covered}} / {{v.tot}} renseignées<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<aside style=\"flex: 1 1 320px; min-width: 0; max-width: 460px\">\n<sc-if value=\"{{cov.hasSel}}\" hint-placeholder-val=\"{{false}}\">\n<div class=\"card\" style=\"padding: 18px 20px; border-top: 3px solid {{cov.sel.col}}\">\n<p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">{{cov.sel.c}} · {{cov.sel.v}} › {{cov.sel.i}}<\u002Fp>\n<h2 class=\"serif\" style=\"margin: 4px 0 6px; font-size: 28px\">{{cov.sel.n}}<\u002Fh2>\n<p style=\"margin: 0 0 10px; font-size: 14px\">{{cov.sel.q}} <span class=\"tag doc\">Annexe 2, p. {{cov.sel.pg}}<\u002Fspan><\u002Fp>\n<sc-if value=\"{{cov.sel.hasSrc}}\" hint-placeholder-val=\"{{false}}\">\n<p style=\"margin: 0 0 6px; font-size: 12.5px; color: var(--mut)\">Indicateurs 2024 rapprochés de cette propriété <span class=\"tag prop\">Proposition<\u002Fspan><\u002Fp>\n<sc-for list=\"{{cov.sel.src}}\" as=\"s\" hint-placeholder-count=\"2\"><div style=\"display: flex; gap: 8px; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line)\"><span>{{s.raw}}<\u002Fspan><span style=\"white-space: nowrap\"><span class=\"mono\">{{s.n}}<\u002Fspan> <span class=\"conf\">{{s.conf}}<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fsc-if>\n<sc-if value=\"{{cov.sel.noSrc}}\" hint-placeholder-val=\"{{true}}\"><p style=\"margin: 0; font-size: 13.5px\">Aucun indicateur de la base 2024 n’a été rapproché de cette propriété. C’est une donnée à produire.<\u002Fp><\u002Fsc-if>\n<button type=\"button\" class=\"ghost\" sc-camel-on-click=\"{{cov.sel.goA}}\" style=\"margin-top: 12px; font-size: 13px\">Ouvrir la fiche dans le modèle →<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{cov.noSel}}\" hint-placeholder-val=\"{{true}}\"><p style=\"margin: 0; font-size: 14px; color: var(--mut)\">Cliquer un point pour voir la question d’observation et les indicateurs 2024 qui pourraient la renseigner.<\u002Fp><\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= B2 ATLAS ================= -->\n<sc-if value=\"{{is.b_atlas}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 8px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Atlas du Parc<\u002Fh1>\n<span class=\"tag obs\">Donnée observée 2024<\u002Fspan><span class=\"tag ana\">Agrégation du groupe · maille 2 km<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 14px; max-width: 820px; color: var(--mut)\">Nombre d’entités localisées par maille de 2 km, selon la valeur attribuée dans la base 2024 (libellés d’origine). Une densité d’entités n’est pas une intensité patrimoniale.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px\"><sc-for list=\"{{atl.chips}}\" as=\"c\" hint-placeholder-count=\"9\"><button type=\"button\" class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\"><span style=\"{{c.dot}}; width: 9px; height: 9px; border-radius: 50%; display: inline-block\"><\u002Fspan>{{c.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 999 1 560px; min-width: 0\">\n<svg sc-camel-view-box=\"0 0 640 542\" style=\"width: 100%; height: auto; display: block; background: #fffdf8; border: 1px solid var(--line); border-radius: 10px\" role=\"img\" aria-label=\"Carte des 21 communes du Parc et densité d’entités par maille\">\n<defs><clipPath id=\"pnrclip\"><path d=\"{{atl.union}}\"><\u002Fpath><\u002FclipPath><\u002Fdefs>\n<g style=\"clip-path: url(#pnrclip)\">\n<sc-for list=\"{{atl.cells}}\" as=\"c\" hint-placeholder-count=\"40\"><rect x=\"{{c.x}}\" y=\"{{c.y}}\" width=\"{{c.s}}\" height=\"{{c.s}}\" rx=\"2\" style=\"fill: {{c.fill}}; fill-opacity: {{c.op}}\"><title>{{c.tip}}<\u002Ftitle><\u002Frect><\u002Fsc-for>\n<\u002Fg>\n<sc-for list=\"{{atl.coms}}\" as=\"m\" hint-placeholder-count=\"21\"><path class=\"svgbtn\" d=\"{{m.d}}\" sc-camel-on-click=\"{{m.pick}}\" style=\"fill: {{m.fill}}; stroke: {{m.st}}; stroke-width: {{m.sw}}; stroke-linejoin: round\"><title>{{m.tip}}<\u002Ftitle><\u002Fpath><\u002Fsc-for>\n<sc-for list=\"{{atl.labels}}\" as=\"l\" hint-placeholder-count=\"21\"><text x=\"{{l.x}}\" y=\"{{l.y}}\" text-anchor=\"middle\" style=\"font-size: 9.5px; font-weight: {{l.w}}; fill: #1d2124; paint-order: stroke; stroke: #fffdf8; stroke-width: 3px; pointer-events: none; font-family: 'IBM Plex Sans', sans-serif\">{{l.t}}<\u002Ftext><\u002Fsc-for>\n<\u002Fsvg>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--mut)\">\n<span>Entités par maille · {{atl.curName}}<\u002Fspan>\n<sc-for list=\"{{atl.bins}}\" as=\"b\" hint-placeholder-count=\"4\"><span style=\"display: flex; align-items: center; gap: 5px\"><span style=\"width: 14px; height: 14px; border-radius: 2px; background: {{b.col}}; opacity: {{b.op}}\"><\u002Fspan>{{b.t}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{atl.isNeutral}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 8px 0 0; font-size: 13px; padding: 8px 12px; border-left: 3px solid #c98500\">Libellé de valeur absent de la nomenclature (« Transmission ») ou vide dans la base 2024 : gris neutre. Le recodage proposé les rattache à des propriétés du Vol. II (voir Données et méthode).<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<aside style=\"flex: 1 1 300px; min-width: 0; max-width: 420px\">\n<div class=\"card\" style=\"padding: 18px 20px\">\n<p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">COMMUNE SÉLECTIONNÉE<\u002Fp>\n<h2 class=\"serif\" style=\"margin: 2px 0 8px; font-size: 30px\">{{atl.com.n}}<\u002Fh2>\n<p style=\"margin: 0 0 10px; font-size: 14px\"><strong style=\"font-weight: 600\">{{atl.com.tot}}<\u002Fstrong> entités : {{atl.com.p}} ponctuelles, {{atl.com.g}} surfaciques.<\u002Fp>\n<p style=\"margin: 0 0 6px; font-size: 12.5px; color: var(--mut)\">Indicateurs 2024 les plus représentés<\u002Fp>\n<sc-for list=\"{{atl.com.top}}\" as=\"t\" hint-placeholder-count=\"5\"><div style=\"display: flex; gap: 8px; align-items: center; font-size: 13.5px; padding: 4px 0\"><span style=\"{{t.dot}}; width: 8px; height: 8px; border-radius: 50%; flex: none\"><\u002Fspan><span style=\"flex: 1\">{{t.t}} <span style=\"color: var(--mut)\">· {{t.v}}<\u002Fspan><\u002Fspan><span class=\"mono\">{{t.n}}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{atl.com.open}}\" style=\"margin-top: 12px\">Ouvrir la fiche commune<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin: 10px 0 0; font-size: 12.5px; color: var(--mut)\">Cliquer une commune sur la carte pour la sélectionner.<\u002Fp>\n<\u002Faside>\n<\u002Fdiv>\n<h2 style=\"margin: 26px 0 10px; font-size: 16px; font-weight: 600\">Une carte par valeur<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px\">\n<sc-for list=\"{{atl.mult}}\" as=\"m\" hint-placeholder-count=\"8\">\n<button type=\"button\" class=\"{{m.cls}}\" sc-camel-on-click=\"{{m.pick}}\">\n<svg sc-camel-view-box=\"0 0 640 542\" style=\"width: 100%; height: auto; display: block\" aria-hidden=\"true\">\n<g style=\"clip-path: url(#pnrclip)\"><sc-for list=\"{{m.cells}}\" as=\"c\" hint-placeholder-count=\"20\"><rect x=\"{{c.x}}\" y=\"{{c.y}}\" width=\"{{c.s}}\" height=\"{{c.s}}\" style=\"fill: {{c.fill}}; fill-opacity: {{c.op}}\"><\u002Frect><\u002Fsc-for><\u002Fg>\n<path d=\"{{atl.union}}\" style=\"fill: none; stroke: #b9b2a5; stroke-width: 2\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"font-size: 13px; margin-top: 4px\">{{m.n}}<\u002Fdiv><div class=\"mono\" style=\"font-size: 11px; color: var(--mut)\">{{m.tot}} entités<\u002Fdiv>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= B3 COMMUNE ================= -->\n<sc-if value=\"{{is.b_commune}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px\"><sc-for list=\"{{com.list}}\" as=\"c\" hint-placeholder-count=\"21\"><button type=\"button\" class=\"{{c.cls}}\" sc-camel-on-click=\"{{c.pick}}\">{{c.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; margin-bottom: 18px\">\n<svg sc-camel-view-box=\"0 0 640 542\" width=\"150\" height=\"127\" style=\"flex: none\" aria-hidden=\"true\"><sc-for list=\"{{com.mini}}\" as=\"m\" hint-placeholder-count=\"21\"><path d=\"{{m.d}}\" class=\"svgbtn\" sc-camel-on-click=\"{{m.pick}}\" style=\"fill: {{m.fill}}; stroke: #f5f2eb; stroke-width: 2\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>\n<div style=\"flex: 1 1 300px\">\n<p class=\"mono\" style=\"margin: 0; font-size: 12px; color: var(--mut)\">INSEE {{com.code}} · {{com.pop}} hab. · {{com.surf}} km² <span class=\"tag doc\">geo.api.gouv.fr<\u002Fspan><\u002Fp>\n<h1 class=\"serif\" style=\"margin: 4px 0 6px; font-size: 44px; line-height: 1.05\">{{com.n}}<\u002Fh1>\n<p style=\"margin: 0; font-size: 15px\">{{com.tot}} entités de la base 2024 : {{com.p}} ponctuelles, {{com.g}} surfaciques (rattachées par leur centroïde). <span class=\"tag obs\">Donnée observée 2024<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 999 1 560px; min-width: 0\">\n<h2 style=\"margin: 0 0 4px; font-size: 16px; font-weight: 600\">Indicateurs 2024 présents<\u002Fh2>\n<p style=\"margin: 0 0 10px; font-size: 12.5px; color: var(--mut)\">Libellés d’origine (fautes comprises). Barre pleine = entités ponctuelles, barre claire = surfaciques. Dernière colonne : propriété du Vol. II proposée.<\u002Fp>\n<div style=\"overflow-x: auto\"><div style=\"min-width: 640px\">\n<sc-for list=\"{{com.rows}}\" as=\"r\" hint-placeholder-count=\"10\">\n<div style=\"display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 54px minmax(0, 190px); gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px\">\n<span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"{{r.dot}}; width: 8px; height: 8px; border-radius: 50%; flex: none\"><\u002Fspan><span>{{r.i}} <span style=\"color: var(--mut)\">· {{r.v}}<\u002Fspan><\u002Fspan><\u002Fspan>\n<div style=\"display: flex; gap: 2px; height: 10px\" title=\"{{r.tip}}\"><div style=\"{{r.wp}}; border-radius: 2px\"><\u002Fdiv><div style=\"{{r.wg}}; opacity: .4; border-radius: 2px\"><\u002Fdiv><\u002Fdiv>\n<span class=\"mono\" style=\"text-align: right\">{{r.n}}<\u002Fspan>\n<span style=\"display: flex; gap: 6px; align-items: center; flex-wrap: wrap\"><span class=\"mono\" style=\"font-size: 12px\">{{r.rec}}<\u002Fspan><span class=\"{{r.confCls}}\">{{r.conf}}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<aside style=\"flex: 1 1 320px; min-width: 0; max-width: 460px\">\n<div class=\"card\" style=\"padding: 16px 18px; margin-bottom: 14px\">\n<p style=\"margin: 0 0 8px; font-size: 13px; color: var(--mut)\">Valeurs concernées après recodage (correspondances fortes et moyennes) <span class=\"tag prop\">Proposition<\u002Fspan><\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\"><sc-for list=\"{{com.present}}\" as=\"v\" hint-placeholder-count=\"5\"><span class=\"fchip\" style=\"cursor: default\"><span style=\"width: 9px; height: 9px; border-radius: 50%; background: {{v.col}}\"><\u002Fspan>{{v.n}} · {{v.k}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"padding: 16px 18px\">\n<p style=\"margin: 0 0 4px; font-size: 13px; color: var(--mut)\">Relations théoriques à vérifier sur ce territoire<\u002Fp>\n<p style=\"margin: 0 0 10px; font-size: 12.5px\"><span class=\"tag doc\">T6, Vol. I pp. 172–174<\u002Fspan> <span class=\"tag ana\">Analyse du groupe<\u002Fspan><\u002Fp>\n<sc-if value=\"{{com.hasRel}}\" hint-placeholder-val=\"{{true}}\">\n<p style=\"margin: 0 0 8px; font-size: 13px\">{{com.nRel}} relations de la matrice T6 relient des valeurs présentes ici. Ce sont des hypothèses du modèle, pas des relations observées.<\u002Fp>\n<div style=\"max-height: 280px; overflow-y: auto\">\n<sc-for list=\"{{com.rels}}\" as=\"r\" hint-placeholder-count=\"6\"><p style=\"margin: 0 0 4px; font-size: 13px\"><span style=\"color: {{r.cs}}\">●<\u002Fspan> {{r.s}} <span class=\"mono\">{{r.glyph}}<\u002Fspan> <span style=\"color: {{r.ct}}\">●<\u002Fspan> {{r.t}} — {{r.r}} <em style=\"color: var(--mut)\">({{r.v}})<\u002Fem><\u002Fp><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{com.noRel}}\" hint-placeholder-val=\"{{false}}\"><p style=\"margin: 0; font-size: 13px\">Moins de deux valeurs concernées : aucune relation T6 à confronter.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= B5 TEMPS ================= -->\n<sc-if value=\"{{is.b_temps}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 8px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Temporalités des données<\u002Fh1>\n<span class=\"tag obs\">Champ « Annee » de la base 2024<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0 0 14px; max-width: 820px; color: var(--mut)\">Nombre d’entités par année, dans les 21 communes. Plusieurs pics correspondent probablement à la date d’un jeu de données plutôt qu’à celle des phénomènes : ils sont signalés.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px\"><sc-for list=\"{{tim.modes}}\" as=\"m\" hint-placeholder-count=\"2\"><button type=\"button\" class=\"{{m.cls}}\" sc-camel-on-click=\"{{m.pick}}\">{{m.n}}<\u002Fbutton><\u002Fsc-for><\u002Fdiv>\n<div style=\"overflow-x: auto\"><div style=\"min-width: 640px\">\n<svg sc-camel-view-box=\"0 0 720 270\" style=\"width: 100%; height: auto; display: block\" role=\"img\" aria-label=\"Histogramme empilé des entités par année ; le tableau ci-dessous en donne les valeurs\">\n<sc-for list=\"{{tim.ticks}}\" as=\"t\" hint-placeholder-count=\"3\"><line x1=\"40\" x2=\"716\" y1=\"{{t.y}}\" y2=\"{{t.y}}\" style=\"stroke: #e4dfd4\"><\u002Fline><text x=\"34\" y=\"{{t.y}}\" dy=\"4\" text-anchor=\"end\" style=\"font-size: 10px; fill: #5b605d; font-family: 'IBM Plex Mono', monospace\">{{t.t}}<\u002Ftext><\u002Fsc-for>\n<sc-for list=\"{{tim.bars}}\" as=\"b\" hint-placeholder-count=\"40\"><rect x=\"{{b.x}}\" y=\"{{b.y}}\" width=\"{{b.w}}\" height=\"{{b.h}}\" rx=\"1\" style=\"fill: {{b.f}}\"><title>{{b.tip}}<\u002Ftitle><\u002Frect><\u002Fsc-for>\n<sc-for list=\"{{tim.xt}}\" as=\"x\" hint-placeholder-count=\"10\"><text x=\"{{x.x}}\" y=\"{{x.y}}\" text-anchor=\"middle\" style=\"font-size: 10px; fill: #5b605d; font-family: 'IBM Plex Mono', monospace\">{{x.t}}<\u002Ftext><\u002Fsc-for>\n<sc-for list=\"{{tim.flags}}\" as=\"f\" hint-placeholder-count=\"3\"><g><title>{{f.txt}}<\u002Ftitle><line x1=\"{{f.x}}\" x2=\"{{f.x}}\" y1=\"16\" y2=\"26\" style=\"stroke: #a86d00; stroke-width: 1.5\"><\u002Fline><text x=\"{{f.x}}\" y=\"{{f.y}}\" text-anchor=\"middle\" style=\"font-size: 10px; fill: #a86d00; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">! {{f.t}}<\u002Ftext><\u002Fg><\u002Fsc-for>\n<\u002Fsvg>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 16px; font-size: 12.5px\"><sc-for list=\"{{tim.legend}}\" as=\"l\" hint-placeholder-count=\"8\"><span style=\"display: flex; gap: 5px; align-items: center\"><span style=\"{{l.dot}}; width: 10px; height: 10px; border-radius: 2px\"><\u002Fspan>{{l.n}}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 20px\">\n<sc-for list=\"{{tim.flags}}\" as=\"f\" hint-placeholder-count=\"3\"><div class=\"card\" style=\"padding: 12px 14px; border-left: 3px solid #c98500\"><div class=\"mono\" style=\"font-size: 12px; color: #a86d00\">! {{f.t}}<\u002Fdiv><div style=\"font-size: 13.5px\">{{f.txt}}<\u002Fdiv><span class=\"tag ana\" style=\"margin-top: 6px\">Analyse du groupe<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv>\n<details><summary style=\"cursor: pointer; font-size: 14px\">Tableau des valeurs (lecture sans couleur)<\u002Fsummary>\n<div style=\"overflow-x: auto; margin-top: 8px\"><sc-raw-table class=\"tbl\" style=\"min-width: 760px\"><sc-raw-thead><sc-raw-tr><sc-raw-th>Année<\u002Fsc-raw-th><sc-raw-th>N<\u002Fsc-raw-th><sc-raw-th>U<\u002Fsc-raw-th><sc-raw-th>A<\u002Fsc-raw-th><sc-raw-th>H<\u002Fsc-raw-th><sc-raw-th>M<\u002Fsc-raw-th><sc-raw-th>AN<\u002Fsc-raw-th><sc-raw-th>« Transmission »<\u002Fsc-raw-th><sc-raw-th>vide<\u002Fsc-raw-th><sc-raw-th>Total<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{tim.rows}}\" as=\"r\" hint-placeholder-count=\"10\"><sc-raw-tr><sc-raw-td class=\"mono\">{{r.b}}<\u002Fsc-raw-td><sc-for list=\"{{r.c}}\" as=\"c\" hint-placeholder-count=\"8\"><sc-raw-td class=\"mono\">{{c}}<\u002Fsc-raw-td><\u002Fsc-for><sc-raw-td class=\"mono\">{{r.tot}}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n<\u002Fdetails>\n<\u002Fsc-if>\n\n<!-- ================= B6 MÉTHODE ================= -->\n<sc-if value=\"{{is.b_methode}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 18px\">\n<h1 class=\"serif\" style=\"margin: 0; font-size: 40px\">Données et méthode<\u002Fh1>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 26px\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Périmètre et sources<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 14px\"><sc-for list=\"{{met.srcs}}\" as=\"s\" hint-placeholder-count=\"3\"><li>{{s}}<\u002Fli><\u002Fsc-for><\u002Ful>\n<h2 style=\"margin: 20px 0 10px; font-size: 16px; font-weight: 600\">Traitements <span class=\"tag ana\">Analyse du groupe<\u002Fspan><\u002Fh2>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 14px\">\n<li>Points : rattachés à une commune par test point-dans-polygone sur les contours officiels.<\u002Fli>\n<li>Polygones : rattachés par la moyenne des sommets de leur premier anneau (approximation du centroïde).<\u002Fli>\n<li>Carte : comptage des entités par maille carrée d’environ 2 km, découpée sur le périmètre des 21 communes.<\u002Fli>\n<li>Aucun score, aucune pondération : comptages et présences uniquement (Annexe 4 §3.5).<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<h2 style=\"margin: 0 0 10px; font-size: 16px; font-weight: 600\">Nettoyage<\u002Fh2>\n<sc-raw-table class=\"tbl\"><sc-raw-tbody><sc-for list=\"{{met.stats}}\" as=\"s\" hint-placeholder-count=\"7\"><sc-raw-tr><sc-raw-td>{{s.k}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\" style=\"text-align: right\">{{s.v}}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag\">{{s.s}}<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table>\n<details style=\"margin-top: 10px\"><summary style=\"cursor: pointer; font-size: 13.5px\">Polygones sans géométrie, par libellé (toutes emprises)<\u002Fsummary>\n<sc-raw-table class=\"tbl\" style=\"margin-top: 6px\"><sc-raw-tbody><sc-for list=\"{{met.nulls}}\" as=\"n\" hint-placeholder-count=\"5\"><sc-raw-tr><sc-raw-td>{{n.k}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\" style=\"text-align: right\">{{n.n}}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<h2 style=\"margin: 0 0 4px; font-size: 16px; font-weight: 600\">Table de recodage : base 2024 → propriétés du Volume II <span class=\"tag prop\">Proposition du groupe, à valider<\u002Fspan><\u002Fh2>\n<p style=\"margin: 0 0 10px; font-size: 13px; color: var(--mut)\">Le rapprochement suit l’intitulé de la propriété et sa question d’observation (Annexe 2). Il ne modifie ni les catégories ni les indicateurs du modèle. « aucune » = pas de propriété équivalente trouvée.<\u002Fp>\n<div style=\"overflow-x: auto\"><sc-raw-table class=\"tbl\" style=\"min-width: 860px\">\n<sc-raw-thead><sc-raw-tr><sc-raw-th>Valeur › caractère › indicateur (base 2024, libellé d’origine)<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right\">Points<\u002Fsc-raw-th><sc-raw-th style=\"text-align: right\">Polygones<\u002Fsc-raw-th><sc-raw-th>Propriété(s) Vol. II proposée(s)<\u002Fsc-raw-th><sc-raw-th>Confiance<\u002Fsc-raw-th><sc-raw-th>Note<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody><sc-for list=\"{{met.rec}}\" as=\"r\" hint-placeholder-count=\"34\"><sc-raw-tr><sc-raw-td>{{r.raw}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\" style=\"text-align: right\">{{r.p}}<\u002Fsc-raw-td><sc-raw-td class=\"mono\" style=\"text-align: right\">{{r.g}}<\u002Fsc-raw-td><sc-raw-td>{{r.rec}}<\u002Fsc-raw-td><sc-raw-td><span class=\"{{r.confCls}}\">{{r.conf}}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"color: var(--mut)\">{{r.note}}<\u002Fsc-raw-td><\u002Fsc-raw-tr><\u002Fsc-for><\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table><\u002Fdiv>\n<h2 style=\"margin: 24px 0 8px; font-size: 16px; font-weight: 600\">Limites<\u002Fh2>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 14px; max-width: 900px\">\n<li>La base 2024 suit l’ancien référentiel du studio : ses valeurs et caractères ne coïncident pas avec le Volume II (ex. « Rareté », « Reconversion », « Transmission » comme valeur).<\u002Fli>\n<li>Trois quarts des polygones n’ont pas de géométrie : la couverture surfacique est sous-estimée.<\u002Fli>\n<li>Les années sont souvent celles des jeux de données : la frise ne date pas les phénomènes.<\u002Fli>\n<li>Le recodage est un rapprochement par intitulé : il doit être validé par l’auteur avant tout usage scientifique.<\u002Fli>\n<li>Les relations T6 affichées par commune sont des hypothèses du modèle : rien dans les données ne les mesure.<\u002Fli>\n<\u002Ful>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<footer style=\"border-top: 1px solid var(--line); padding: 16px 20px; font-size: 12px; color: var(--mut)\">\n<div style=\"max-width: 1320px; margin: 0 auto\">Prototype de travail · Sources : Théorie générale de l’observation patrimoniale, Vol. I (livraison 1) et Vol. II Annexes (rév. 1) ; base 2024 du studio ; INPN ; geo.api.gouv.fr. Pagination du Vol. II : pages du PDF.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nvar OTVP = {\"VAL\":[\"Nouveauté\",\"Usage\",\"Art\",\"Histoire\",\"Mémoire\",\"Ancienneté\"],\"VC\":{\"Nouveauté\":\"#e8c547\",\"Usage\":\"#5fb3a1\",\"Art\":\"#d9739b\",\"Histoire\":\"#8c8ce6\",\"Mémoire\":\"#e0884a\",\"Ancienneté\":\"#9fb86a\"},\"TREE\":[{\"v\":\"Nouveauté\",\"car\":[{\"n\":\"Innovation\",\"ind\":[{\"n\":\"Formation\",\"p\":[\"N1\",\"N2\",\"N3\",\"N4\"]},{\"n\":\"Différenciation\",\"p\":[\"N5\",\"N6\",\"N7\",\"N8\",\"N9\"]}]},{\" ditionne pas l'ancienneté (pp. 173–174).\",\"Cellule Nouveauté → Art : double relation « Limitation / Renforcement » dans le tableau (p. 172).\"]},\"T7A\":{\"ref\":\"Vol. I, T7A, p. 176\",\"rows\":[[\"Nouveauté\",\"Innovation\",\"Intégrité\",\"Produire le changement tout en maintenant la cohérence.\"],[\"Usage\",\"Attribution\",\"Appropriation\",\"Définir la fonction puis observer son appropriation effective.\"],[\"Art\",\"Célébration\",\"Adhésion\",\"Rendre visible puis stabiliser la reconnaissance esthétique.\"],[\"Histoire\",\"Reconnaissance\",\"Témoignage\",\"Authentifier puis transmettre les faits historiques.\"],[\"Mémoire\",\"Évocation\",\"Partage\",\"Réactiver puis diffuser la mémoire collective.\"],[\"Ancienneté\",\"Dégradation\",\"Obsolescence\",\"Observer les effets du temps sur la matière et sur les fonctions.\"]]},\"T7B\":{\"ref\":\"Vol. I, T7B, pp. 176–177\",\"rows\":[[\"Innovation\",\"Attribution\",\"Condition\",\"Les innovations rendent possibles de nouveaux usages.\"],[\"Innovation\",\"Dégradation\",\"Limitation\",\"L'innovation peut ralentir ou compenser certains processus de dégradation.\"],[\"Innovation\",\"Obsolescence\",\"Renforcement (paradoxal)\",\"Toute innovation peut rendre des techniques antérieures obsolètes.\"],[\"Attribution\",\"Appropriation\",\"Condition\",\"Un usage reconnu crée le cadre d'une appropriation.\"],[\"Appropriation\",\"Partage\",\"Renforcement\",\"Les pratiques sociales favorisent la transmission.\"],[\"Célébration\",\"Adhésion\",\"Renforcement\",\"La visibilité culturelle consolide la reconnaissance esthétique.\"],[\"Reconnaissance\",\"Célébration\",\"Condition\",\"Une reconnaissance officielle facilite la mise en valeur.\"],[\"Témoignage\",\"Évocation\",\"Condition\",\"Les traces historiques alimentent la mémoire.\"],[\"Évocation\",\"Partage\",\"Renforcement\",\"Une mémoire activée favorise sa diffusion.\"],[\"Dégradation\",\"Reconnaissance\",\"Renforcement\",\"Certaines altérations rendent visibles les différentes st
